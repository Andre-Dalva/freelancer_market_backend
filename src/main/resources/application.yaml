spring:
  application:
    name: backend1
  datasource:
    url: jdbc:mysql:${DB_URL}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 900 # 15min
    refreshTokenExpiration: 604800 # 7days